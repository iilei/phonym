name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # api:diff compares with the last release tag.
          persist-credentials: false

      # Installs the tools pinned in mise.toml (Go, golangci-lint, rumdl) and caches them. Every step below is a mise
      # task, so each failure reproduces locally with the same command.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19 # mise itself; pinned

      # fmt:check, vet, lint, lint:md, golden:check (the Python reference reproduces testdata/), test (race
      # detector) and build.
      - run: mise run check

      # The Go library's API changes since the last release, in the job summary. Informational: before 1.0 a break is
      # allowed with a new minor version.
      - name: API changes since the last release
        run: |
          { echo '```text'; mise run -q api:diff; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      - run: mise run coverage

  # Builds and tests on the three common systems: the golden files must match byte for byte everywhere.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only Go: linting and the reference check run in the check job above.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19 # mise itself; pinned
          install_args: go

      - run: go build ./...

      - run: go test ./...
