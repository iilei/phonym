name: release

# Builds, signs and publishes a release for every v* tag: goreleaser cross-compiles, GPG-signs every archive and
# checksums.txt, and every file in checksums.txt gets a build provenance attestation.
# Secrets (environment "release", v* tags only): GPG_PRIVATE_KEY (ASCII-armoured private key) and GPG_PASSPHRASE.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # The GPG secrets live in this environment, which only v* tags may deploy to.
    environment: release
    permissions:
      contents: write # Creates the release and uploads its assets.
      id-token: write # Signs the provenance attestation (Sigstore).
      attestations: write # Stores it.
    steps:
      # Actions are pinned to commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs the tags for the version and the changelog.
          persist-credentials: false

      # Installs the tools pinned in mise.toml, goreleaser included.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19 # mise itself; pinned

      - id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # Fail fast (before the build) if the key cannot sign, e.g. because the key or its signing subkey has expired.
      - name: Verify GPG key can sign
        env:
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          gpg --list-secret-keys --list-options show-unusable-subkeys "$GPG_FINGERPRINT"
          if ! echo "preflight" | gpg --batch --local-user "$GPG_FINGERPRINT" --detach-sign --output /dev/null; then
            msg="GPG key $GPG_FINGERPRINT cannot sign (expired/revoked key or subkey?)."
            echo "::error::$msg Extend its expiry and update the GPG_PRIVATE_KEY secret."
            exit 1
          fi

      # Fails before anything is published when the Go library's API broke but the tag doesn't raise the minor
      # version (before 1.0) or the major version.
      - run: mise run api:diff --release "$GITHUB_REF_NAME"

      - run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}

      # Provenance for every file checksums.txt lists: gh attestation verify checks it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/release/checksums.txt
